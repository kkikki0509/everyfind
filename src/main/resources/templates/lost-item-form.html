<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>분실물 게시판</title>

    <style>
        body {
            margin: 30px;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        thead th {
            position: sticky;
            top: 0;
            background-color: #f2f2f2;
        }

        .register-form {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <h1>분실물 게시판</h1>

    <h3>목록</h3>

    <!-- 게시물 전체 목록 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>카테고리</th>
                    <th>분실 장소</th>
                    <th>분실 날짜</th>
                    <th>상세 내용</th>
                </tr>
            </thead>

            <tbody id="lostItems">
            </tbody>
        </table>
    </div>

    <!-- 게시물 단일 조회 및 등록 -->
    <div class="register-form">
        <h3>분실물 등록</h3>

        <form id="form">
            <input id="title" placeholder="제목" required>
            <input id="category" placeholder="카테고리" required>
            <input id="lostPlace" placeholder="분실 장소" required>
            <input id="feature" placeholder="특징">
            <input id="lostDate" type="date" required>

            <button type="submit">등록</button>
        </form>
    </div>

    <input type="hidden" id="csrf" th:value="${_csrf.token}">

    <script>
        // 분실물 등록
        document.getElementById("form").addEventListener("submit", async function(e) {

            e.preventDefault();

            const response = await fetch("/lost/items", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN": document.getElementById("csrf").value
                },
                body: JSON.stringify({
                    title: document.getElementById("title").value,
                    category: document.getElementById("category").value,
                    lostPlace: document.getElementById("lostPlace").value,
                    feature: document.getElementById("feature").value,
                    lostDate: document.getElementById("lostDate").value
                })
            });

            if (response.ok) {
                alert("등록 성공!");

                loadLostItems(); // 새로 고침
                document.getElementById("form").reset(); // 폼 초기화
            }
            else {
                alert("등록 실패!");
            }
        });

        // 전체 목록 조회
        async function loadLostItems() {

            const response = await fetch("/lost/items");

            if (!response.ok) {
                alert("조회 불가!");
                return;
            }

            const items = await response.json();
            const lostItems = document.getElementById("lostItems");
            lostItems.innerHTML = ""; // 기존 목록 초기화

            items.forEach(item => { // 전체 게시물을 표에 추가
                const row = document.createElement("tr");

                const id = document.createElement("td");
                id.textContent = item.id;

                const title = document.createElement("td");
                title.textContent = item.title;

                const category = document.createElement("td");
                category.textContent = item.category;

                const place = document.createElement("td");
                place.textContent = item.lostPlace;

                const date = document.createElement("td");
                date.textContent = item.lostDate;

                const detail = document.createElement("td");

                const detailButton = document.createElement("button");
                detailButton.type = "button";
                detailButton.textContent = "조회";

                detailButton.addEventListener("click", function() {
                    window.location.href = "/lost/items/" + item.id + "/page"; // GET 요청 방식
                });

                detail.appendChild(detailButton);

                row.appendChild(id);
                row.appendChild(title);
                row.appendChild(category);
                row.appendChild(place);
                row.appendChild(date);
                row.appendChild(detail);

                lostItems.appendChild(row);
            });
        }

        loadLostItems(); // 페이지 실행 시 목록 조회

    </script>
</body>
</html>

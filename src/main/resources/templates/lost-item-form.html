<!DOCTYPE html>
    <html lang="ko" xmlns:th="http://www.thymeleaf.org">

    <body>

        <h1>분실물 등록 테스트</h1>

        <form id="form">
            <hr>

            <h2>수정 / 삭제 테스트</h2>

            <input id="lostId" type="number" placeholder="게시물 ID">

            <button type="button" id="updateButton">수정</button>
            <button type="button" id="deleteButton">삭제</button>

            <input id="title" placeholder="제목">
            <input id="category" placeholder="카테고리">
            <input id="lostPlace" placeholder="분실 장소">
            <input id="feature" placeholder="특징">
            <input id="lostDate" type="date">

            <button type="submit">등록</button>

        </form>

        <input type="hidden" id="csrf" th:value="${_csrf.token}">

        <script>
            document.getElementById("form").addEventListener("submit", async function(e) {

                e.preventDefault(); // 페이지 새로고침 무시

                const response = await fetch("/lost/items", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-TOKEN": document.getElementById("csrf").value
                    },
                    body: JSON.stringify({
                        title: document.getElementById("title").value,
                        category: document.getElementById("category").value,
                        lostPlace: document.getElementById("lostPlace").value,
                        feature: document.getElementById("feature").value,
                        lostDate: document.getElementById("lostDate").value
                    })
                });

                if (response.ok) {
                    alert("등록 성공!");
                    console.log(await response.json());
                } else {
                    alert("등록 실패: " + response.status);
                }
            });

            document.getElementById("updateButton").addEventListener("click", async function() {

                const lostId = document.getElementById("lostId").value;

                const response = await fetch("/lost/items/" + lostId, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-TOKEN": document.getElementById("csrf").value
                    },
                    body: JSON.stringify({
                        title: document.getElementById("title").value,
                        category: document.getElementById("category").value,
                        lostPlace: document.getElementById("lostPlace").value,
                        feature: document.getElementById("feature").value,
                        lostDate: document.getElementById("lostDate").value
                    })
                });

                if (response.ok) {
                    alert("수정 성공!");
                } else {
                    alert("수정 실패: " + response.status);
                }
            });


            document.getElementById("deleteButton").addEventListener("click", async function() {

                const lostId = document.getElementById("lostId").value;

                const response = await fetch("/lost/items/" + lostId, {
                    method: "DELETE",
                    headers: {
                        "X-CSRF-TOKEN": document.getElementById("csrf").value
                    }
                });

                if (response.ok) {
                    alert("삭제 성공!");
                } else {
                    alert("삭제 실패: " + response.status);
                }
            });
        </script>

    </body>
</html>

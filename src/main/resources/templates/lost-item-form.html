<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>

<h1>분실물 등록 테스트</h1>

<form id="form">

    <hr>

    <h2>수정 / 삭제 테스트</h2>

    <input id="lostId" type="number" placeholder="게시물 ID">

    <button type="button" id="getButton">조회</button>
    <button type="button" id="updateButton">수정</button>
    <button type="button" id="deleteButton">삭제</button>

    <br><br>

    <input id="title" placeholder="제목">
    <input id="category" placeholder="카테고리">
    <input id="lostPlace" placeholder="분실 장소">
    <input id="feature" placeholder="특징">
    <input id="lostDate" type="date">

    <button type="submit">등록</button>

</form>

<hr>

<h2>분실물 정보</h2>

<div id="lostItem"></div>

<hr>

<h2>매칭 후보</h2>

<div id="matches"></div>

<input type="hidden" id="csrf" th:value="${_csrf.token}">


<script>

    // =========================
    // 분실물 등록
    // =========================

    document.getElementById("form").addEventListener("submit", async function(e) {

        e.preventDefault();

        const response = await fetch("/lost/items", {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "X-CSRF-TOKEN":
                document.getElementById("csrf").value
            },

            body: JSON.stringify({
                title:
                document.getElementById("title").value,

                category:
                document.getElementById("category").value,

                lostPlace:
                document.getElementById("lostPlace").value,

                feature:
                document.getElementById("feature").value,

                lostDate:
                document.getElementById("lostDate").value
            })
        });


        if (response.ok) {

            alert("등록 성공!");

            const data = await response.json();

            const matchesDiv =
                document.getElementById("matches");

            matchesDiv.innerHTML = "";


            if (data.matches.length === 0) {

                matchesDiv.innerHTML =
                    "<p>일치하는 습득물이 없습니다.</p>";

            } else {

                data.matches.forEach(match => {

                    matchesDiv.innerHTML += `
                        <p>
                            ${match.foundItem.title}
                            - 일치율: ${match.score}%

                            <button
                                type="button"
                                data-found-id="${match.foundItem.id}">
                                찾았다
                            </button>
                        </p>
                    `;
                });


                // 찾았다 버튼
                matchesDiv.querySelectorAll("button")
                    .forEach(button => {

                        button.addEventListener(
                            "click",
                            async function() {

                                const foundId =
                                    this.dataset.foundId;

                                const response =
                                    await fetch(
                                        "/lost/items/"
                                        + data.lostItem.id
                                        + "/matches/"
                                        + foundId,
                                        {
                                            method: "POST",

                                            headers: {
                                                "X-CSRF-TOKEN":
                                                document
                                                    .getElementById("csrf")
                                                    .value
                                            }
                                        }
                                    );


                                if (response.ok) {

                                    alert(
                                        "분실물을 찾았습니다!"
                                    );

                                } else {

                                    alert(
                                        "처리에 실패했습니다: "
                                        + response.status
                                    );
                                }
                            }
                        );
                    });
            }

        } else {

            alert(
                "등록 실패: "
                + response.status
            );
        }
    });



    // =========================
    // 분실물 조회
    // =========================

    document.getElementById("getButton")
        .addEventListener("click", async function() {

            const lostId =
                document.getElementById("lostId").value;


            const response =
                await fetch("/lost/items/" + lostId);


            if (response.ok) {

                const data =
                    await response.json();


                // -------------------------
                // 분실물 정보 출력
                // -------------------------

                document.getElementById("lostItem").innerHTML = `

                <p>
                    제목:
                    ${data.lostItem.title}
                </p>

                <p>
                    카테고리:
                    ${data.lostItem.category}
                </p>

                <p>
                    분실 장소:
                    ${data.lostItem.lostPlace}
                </p>

                <p>
                    특징:
                    ${data.lostItem.feature}
                </p>

                <p>
                    분실 날짜:
                    ${data.lostItem.lostDate}
                </p>

                <p>
                    상태:
                    ${data.lostItem.currentStatus}
                </p>
            `;


                // -------------------------
                // 매칭 후보 출력
                // -------------------------

                const matchesDiv =
                    document.getElementById("matches");

                matchesDiv.innerHTML = "";


                if (data.matches.length === 0) {

                    matchesDiv.innerHTML =
                        "<p>일치하는 습득물이 없습니다.</p>";

                } else {

                    data.matches.forEach(match => {

                        matchesDiv.innerHTML += `
                        <p>
                            ${match.foundItem.title}
                            - 일치율: ${match.score}%

                            <button
                                type="button"
                                data-found-id="${match.foundItem.id}">
                                찾았다
                            </button>
                        </p>
                    `;
                    });


                    // -------------------------
                    // 찾았다 버튼
                    // -------------------------

                    matchesDiv.querySelectorAll("button")
                        .forEach(button => {

                            button.addEventListener(
                                "click",
                                async function() {

                                    const foundId =
                                        this.dataset.foundId;


                                    const response =
                                        await fetch(
                                            "/lost/items/"
                                            + data.lostItem.id
                                            + "/matches/"
                                            + foundId,
                                            {
                                                method: "POST",

                                                headers: {
                                                    "X-CSRF-TOKEN":
                                                    document
                                                        .getElementById("csrf")
                                                        .value
                                                }
                                            }
                                        );


                                    if (response.ok) {

                                        alert(
                                            "분실물을 찾았습니다!"
                                        );


                                        // 화면의 상태도 변경
                                        const statusElement =
                                            document.querySelector(
                                                "#lostItem p:last-child"
                                            );

                                        statusElement.innerText =
                                            "상태: FOUND";


                                    } else {

                                        alert(
                                            "처리에 실패했습니다: "
                                            + response.status
                                        );
                                    }
                                }
                            );
                        });
                }

            } else {

                alert(
                    "조회 실패: "
                    + response.status
                );
            }
        });



    // =========================
    // 분실물 수정
    // =========================

    document.getElementById("updateButton")
        .addEventListener("click", async function() {

            const lostId =
                document.getElementById("lostId").value;


            const response =
                await fetch("/lost/items/" + lostId, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json",

                        "X-CSRF-TOKEN":
                        document.getElementById("csrf").value
                    },

                    body: JSON.stringify({

                        title:
                        document.getElementById("title").value,

                        category:
                        document.getElementById("category").value,

                        lostPlace:
                        document.getElementById("lostPlace").value,

                        feature:
                        document.getElementById("feature").value,

                        lostDate:
                        document.getElementById("lostDate").value
                    })
                });


            if (response.ok) {

                alert("수정 성공!");

            } else {

                alert(
                    "수정 실패: "
                    + response.status
                );
            }
        });



    // =========================
    // 분실물 삭제
    // =========================

    document.getElementById("deleteButton")
        .addEventListener("click", async function() {

            const lostId =
                document.getElementById("lostId").value;


            const response =
                await fetch("/lost/items/" + lostId, {

                    method: "DELETE",

                    headers: {
                        "X-CSRF-TOKEN":
                        document.getElementById("csrf").value
                    }
                });


            if (response.ok) {

                alert("삭제 성공!");

            } else {

                alert(
                    "삭제 실패: "
                    + response.status
                );
            }
        });

</script>

</body>
</html>

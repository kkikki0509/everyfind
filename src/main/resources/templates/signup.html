<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>

    <h1>회원가입</h1>

    <h3>사용자 인증</h3>
    <input id="email" type="email" placeholder="학교 이메일">
    <input id="code" placeholder="인증번호">
    <button id="sendCode">인증번호 요청</button>
    <button id="verifyCode">인증 확인</button>

    <br/>

    <h3>입력 정보</h3>
    <input id="name" placeholder="이름">
    <input id="password" type="password" placeholder="비밀번호">
    <button id="register" disabled>회원가입</button>

    <input type="hidden" id="csrf" th:value="${_csrf.token}">

    <script>
        /* 인증번호 요청 */
        document.getElementById("sendCode").addEventListener("click", async function() {
            const email = document.getElementById("email").value;

            const response = await fetch("/members/email", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN": document.getElementById("csrf").value
                },
                body: JSON.stringify({
                    email: email
                })
            });

            if (response.ok) {
                alert("인증번호가 발송되었습니다.");
            } else {
                alert("인증번호 발송 실패: " + response.status);
            }

        });

        /* 인증번호 확인 */
        document.getElementById("verifyCode").addEventListener("click", async function() {
            const email = document.getElementById("email");
            const code = document.getElementById("code").value;

            const response = await fetch("/members/email/verify", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN": document.getElementById("csrf").value
                },
                body: JSON.stringify({
                    email: email.value,
                    code: code
                })
            });

            if (response.ok && await response.json()) { // 인증 확인 시
                const registerBtn = document.getElementById('register');
                email.readOnly = true; // 이메일(id) 읽기 전용
                registerBtn.disabled = false; // 회원가입 버튼 사용

                alert("인증 성공!");
            }
            else {
                alert("인증번호가 올바르지 않습니다.");
            }

        });

        /* 회원 가입 */
        document.getElementById("register").addEventListener("click", async function() {

            const response = await fetch("/members", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN": document.getElementById("csrf").value
                },
                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                })
            });

            if (response.ok) {
                alert("회원가입 성공!");
                location.href = "/members/login";
            }
            else {
                alert("회원가입 실패: " + response.status);
            }
        });

    </script>

</body>
</html>
